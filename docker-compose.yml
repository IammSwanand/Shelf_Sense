# ShelfSense Microservices Suite - Docker Compose
services:

  #  Detector Service (YOLO11-s640 SKU-110K) 
  detector:
    build:
      context: ./detector_service
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment:
      - DETECTOR_WEIGHTS_PATH=/app/weights/sku110k-yolo11-s640.pt
      - WEIGHTS_DOWNLOAD_URL=${WEIGHTS_DOWNLOAD_URL:-}
      - DET_CONF_THRESHOLD=${DET_CONF_THRESHOLD:-0.25}
      - DET_IOU_THRESHOLD=${DET_IOU_THRESHOLD:-0.45}
      - DET_IMG_SIZE=${DET_IMG_SIZE:-640}
      - DEVICE=${DEVICE:-auto}
      - PORT=5001
    volumes:
      # Mount weights read-only  weights remain local, not baked into the image
      - ./detector_service/weights:/app/weights:ro
      - ./detector_service/app.py:/app/app.py
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  #  Grouping Service (DINOv2 + HSV Multimodal Agglomerative Clustering) 
  grouping:
    build:
      context: ./grouping_service
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment:
      - CLUSTER_THRESHOLD=${CLUSTER_THRESHOLD:-auto}
      - DINO_WEIGHT=${DINO_WEIGHT:-0.70}
      - COLOR_WEIGHT=${COLOR_WEIGHT:-0.30}
      - DEVICE=${DEVICE:-auto}
      - PORT=5002
    volumes:
      - ./grouping_service/app.py:/app/app.py
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s   # DINOv2 download on first start takes longer
    restart: unless-stopped

  #  Flask Orchestrator 
  flask:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
    container_name: flask_app
    environment:
      - DETECTOR_URL=http://detector:5001
      - GROUPING_URL=http://grouping:5002
      - DOWNSTREAM_TIMEOUT=${DOWNSTREAM_TIMEOUT:-60}
      - OUTPUTS_DIR=/app/outputs
      - PORT=5000
      # Rate-card filter thresholds (all optional  defaults are in filtering.py)
      - RATECARD_MAX_ASPECT=${RATECARD_MAX_ASPECT:-2.5}
      - RATECARD_MAX_HEIGHT_FRAC=${RATECARD_MAX_HEIGHT_FRAC:-0.06}
      - RATECARD_MIN_COLOR_FRACTION=${RATECARD_MIN_COLOR_FRACTION:-0.60}
      - RATECARD_ROW_HEIGHT_RATIO=${RATECARD_ROW_HEIGHT_RATIO:-0.50}
      - RATECARD_DEBUG=${RATECARD_DEBUG:-false}
    volumes:
      - ./flask_app/app.py:/app/app.py
      - ./flask_app/filtering.py:/app/filtering.py
      - ./flask_app/templates:/app/templates
      - ./flask_app/static:/app/static
      # outputs/ bind mount: visualizations are saved to host outputs/ folder
      - ./outputs:/app/outputs
    ports:
      - "5000:5000"
    depends_on:
      detector:
        condition: service_healthy
      grouping:
        condition: service_healthy
    restart: unless-stopped

